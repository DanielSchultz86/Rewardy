<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rewardy Admin Dashboard</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121214; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .hidden { display: none !important; }
    
    /* Login */
    #login-section { max-width: 400px; margin: 100px auto; background: #232227; padding: 30px; border-radius: 12px; text-align: center; }
    input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #3F3F46; background: #2A2A30; color: white; box-sizing: border-box; }
    button { background-color: #CC5225; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
    button:hover { background-color: #FF6B35; }
    
    /* Dashboard Stats */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .header button { width: auto; background-color: #3F3F46; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: #232227; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #3F3F46; }
    .stat-card h3 { margin: 0; color: white; font-size: 14px; opacity: 0.6; }
    .stat-card p { margin: 10px 0 0 0; font-size: 32px; font-weight: bold; color: #008D3D; }

    /* Table */
    .controls { display: flex; gap: 10px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; background: #232227; border-radius: 12px; overflow: hidden; }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid #3F3F46; }
    th { background: #2A2A30; color: #FFD166; }
    .btn-lock { background-color: #e63946; padding: 8px 12px; width: auto; font-size: 13px; }
    .btn-unlock { background-color: #008D3D; padding: 8px 12px; width: auto; font-size: 13px; }
    .btn-details { background-color: #3F3F46; padding: 8px 12px; width: auto; font-size: 13px; margin-right: 8px; }
    .btn-details:hover { background-color: #52525b; }
    .status-locked { color: #e63946; font-weight: bold; }
    .status-active { color: #008D3D; font-weight: bold; }

    /* Modal (Popup boks) */
    .modal { position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; }
    .modal-content { background-color: #232227; padding: 30px; border-radius: 12px; border: 1px solid #3F3F46; width: 400px; max-width: 90%; position: relative; }
    .close-btn { position: absolute; top: 15px; right: 20px; color: #fff; font-size: 24px; font-weight: bold; cursor: pointer; opacity: 0.6; }
    .close-btn:hover { opacity: 1; }
    .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
    .modal-stat { background: #2A2A30; padding: 15px; border-radius: 8px; text-align: center; }
    .modal-stat h4 { margin: 0 0 5px 0; font-size: 12px; color: #888; }
    .modal-stat p { margin: 0; font-size: 24px; font-weight: bold; color: #FFD166; }
  </style>
</head>
<body>

  <div class="container">
    <div id="login-section">
      <h2>Admin Login</h2>
      <input type="email" id="email" placeholder="Admin Email">
      <input type="password" id="password" placeholder="Adgangskode">
      <button id="login-btn">Log ind</button>
      <p id="login-error" style="color: #e63946; margin-top: 10px; font-weight: bold;"></p>
    </div>

    <div id="dashboard-section" class="hidden">
      <div class="header">
        <h2>Rewardy Admin</h2>
        <button id="logout-btn">Log ud</button>
      </div>

      <div class="stats-grid">
        <div class="stat-card"><h3>Brugere i alt</h3><p id="stat-users">...</p></div>
        <div class="stat-card"><h3>Familier oprettet</h3><p id="stat-families">...</p></div>
        <div class="stat-card"><h3>Medlemmer (Børn)</h3><p id="stat-members">...</p></div>
        <div class="stat-card"><h3>Belønninger</h3><p id="stat-rewards">...</p></div>
        <div class="stat-card"><h3>Opgaver i alt</h3><p id="stat-tasks">...</p></div>
      </div>

      <h3>Brugeradministration</h3>
      <div class="controls">
        <input type="text" id="search-input" placeholder="Søg efter navn, email eller UID..." style="max-width: 400px; margin: 0;">
      </div>

      <table>
        <thead>
          <tr>
            <th>Brugernavn</th>
            <th>Email</th>
            <th>UID</th>
            <th>Status</th>
            <th>Handling</th>
          </tr>
        </thead>
        <tbody id="user-table-body">
          </tbody>
      </table>
    </div>
  </div>

  <div id="user-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" id="close-modal">&times;</span>
      <h2 id="modal-title" style="margin-top: 0;">Bruger detaljer</h2>
      <p id="modal-uid" style="font-size: 12px; color: #888; margin-bottom: 20px;"></p>
      
      <div id="modal-loading" style="text-align: center; color: #FF6B35; font-weight: bold;">Henter data...</div>
      
      <div id="modal-stats" class="modal-grid hidden">
        <div class="modal-stat"><h4>Familier</h4><p id="m-fam">0</p></div>
        <div class="modal-stat"><h4>Medlemmer</h4><p id="m-mem">0</p></div>
        <div class="modal-stat"><h4>Belønninger</h4><p id="m-rew">0</p></div>
        <div class="modal-stat"><h4>Opgaver</h4><p id="m-tsk">0</p></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, collectionGroup, getCountFromServer, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAlk1q_wIXXZ6VghBRQ5xA9kvCvLP1XExY",
      authDomain: "rewardy-b7efa.firebaseapp.com",
      projectId: "rewardy-b7efa",
      storageBucket: "rewardy-b7efa.firebasestorage.app",
      messagingSenderId: "929026684024",
      appId: "1:929026684024:web:ea57e6072cb0d8693d298d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    const ALLOWED_ADMIN_UID = "Zs4Oh7OOraR7HfxKkfJeergYPl63";

    // UI Elementer
    const loginSec = document.getElementById('login-section');
    const dashSec = document.getElementById('dashboard-section');
    const tableBody = document.getElementById('user-table-body');
    const errorMsg = document.getElementById('login-error');
    const userModal = document.getElementById('user-modal');

    // Lyt efter Auth status
    onAuthStateChanged(auth, (user) => {
      if (user) {
        if (user.uid === ALLOWED_ADMIN_UID) {
          currentUser = user;
          errorMsg.innerText = "";
          loginSec.classList.add('hidden');
          dashSec.classList.remove('hidden');
          loadDashboardData();
        } else {
          signOut(auth);
          errorMsg.innerText = "Adgang nægtet: Du har ikke administrator-rettigheder.";
        }
      } else {
        loginSec.classList.remove('hidden');
        dashSec.classList.add('hidden');
      }
    });

    document.getElementById('login-btn').addEventListener('click', async () => {
      const e = document.getElementById('email').value;
      const p = document.getElementById('password').value;
      errorMsg.innerText = "";
      try {
        await signInWithEmailAndPassword(auth, e, p);
      } catch (err) {
        errorMsg.innerText = "Forkert email eller adgangskode.";
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

    async function loadDashboardData() {
      try {
        const usersCount = await getCountFromServer(collection(db, 'users'));
        document.getElementById('stat-users').innerText = usersCount.data().count;

        const familiesCount = await getCountFromServer(collection(db, 'families'));
        document.getElementById('stat-families').innerText = familiesCount.data().count;

        const membersCount = await getCountFromServer(collection(db, 'members'));
        document.getElementById('stat-members').innerText = membersCount.data().count;

        const rewardsCount = await getCountFromServer(collectionGroup(db, 'rewards'));
        document.getElementById('stat-rewards').innerText = rewardsCount.data().count;

        const tasksCount = await getCountFromServer(collectionGroup(db, 'tasks'));
        document.getElementById('stat-tasks').innerText = tasksCount.data().count;

        loadUsers();
      } catch (error) {
        console.error("Fejl ved hentning af data:", error);
      }
    }

    window.allUsersData = [];
    async function loadUsers() {
      try {
        const querySnapshot = await getDocs(query(collection(db, "users")));
        window.allUsersData = [];
        querySnapshot.forEach((doc) => {
          window.allUsersData.push({ id: doc.id, ...doc.data() });
        });
        renderTable(window.allUsersData);
      } catch (error) {
        console.error("Fejl ved hentning af brugerliste:", error);
      }
    }

    function renderTable(users) {
      tableBody.innerHTML = "";
      users.forEach(u => {
        const isBlocked = u.isBlocked === true;
        const statusText = isBlocked ? "LÅST" : "Aktiv";
        const statusClass = isBlocked ? "status-locked" : "status-active";
        const btnClass = isBlocked ? "btn-unlock" : "btn-lock";
        const btnText = isBlocked ? "Lås op" : "Lås";
        
        const displayName = u.username || u.navn || u.displayName || 'Ukendt';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${displayName}</td>
          <td>${u.email || '-'}</td>
          <td style="font-size: 12px; color: #888;">${u.id}</td>
          <td class="${statusClass}">${statusText}</td>
          <td>
            <button class="btn-details" onclick="openUserModal('${u.id}', '${displayName}')">Detaljer</button>
            <button class="${btnClass}" onclick="toggleUserLock('${u.id}', ${isBlocked})">${btnText}</button>
          </td>
        `;
        tableBody.appendChild(tr);
      });
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = window.allUsersData.filter(u => 
        (u.username && u.username.toLowerCase().includes(term)) ||
        (u.navn && u.navn.toLowerCase().includes(term)) ||
        (u.email && u.email.toLowerCase().includes(term)) ||
        (u.id.toLowerCase().includes(term))
      );
      renderTable(filtered);
    });

    window.toggleUserLock = async (uid, currentlyBlocked) => {
      const reason = currentlyBlocked ? "" : prompt("Hvorfor skal brugeren låses?");
      if (!currentlyBlocked && reason === null) return;

      try {
        await updateDoc(doc(db, "users", uid), {
          isBlocked: !currentlyBlocked,
          lockedAt: !currentlyBlocked ? new Date() : null,
          lockedBy: !currentlyBlocked ? currentUser.uid : null,
          lockReason: !currentlyBlocked ? reason : null
        });
        loadUsers();
      } catch (error) {
        alert("Der opstod en fejl: " + error.message);
      }
    };

    // --- OPDATERET FUNKTION MED KORREKTE DATABASE-FELTER ---
    window.openUserModal = async (uid, username) => {
      document.getElementById('modal-title').innerText = `Data for ${username}`;
      document.getElementById('modal-uid').innerText = `UID: ${uid}`;
      document.getElementById('modal-loading').classList.remove('hidden');
      document.getElementById('modal-stats').classList.add('hidden');
      userModal.classList.remove('hidden');

      try {
        // Tjekker nu i "admins" arrayet i stedet for et enkelt string-felt
        const famQuery = query(collection(db, 'families'), where('admins', 'array-contains', uid));
        const famSnap = await getDocs(famQuery);
        
        let totalFams = famSnap.size;
        let totalMems = 0;
        let totalRews = 0;
        let totalTasks = 0;

        for (const fDoc of famSnap.docs) {
          const famId = fDoc.id;
          const famData = fDoc.data();

          // Vi tæller blot ID'erne inde i 'members' arrayet
          if (famData.members && Array.isArray(famData.members)) {
            totalMems += famData.members.length;
          }

          // Hent belønninger under familien
          const rewSnap = await getDocs(collection(db, `families/${famId}/rewards`));
          totalRews += rewSnap.size;

          // Hent opgaver 
          for (const rDoc of rewSnap.docs) {
            const tskSnap = await getCountFromServer(collection(db, `families/${famId}/rewards/${rDoc.id}/tasks`));
            totalTasks += tskSnap.data().count;
          }
        }

        // Opdater Modal UI
        document.getElementById('m-fam').innerText = totalFams;
        document.getElementById('m-mem').innerText = totalMems;
        document.getElementById('m-rew').innerText = totalRews;
        document.getElementById('m-tsk').innerText = totalTasks;

        document.getElementById('modal-loading').classList.add('hidden');
        document.getElementById('modal-stats').classList.remove('hidden');

      } catch (error) {
        console.error(error);
        document.getElementById('modal-loading').innerText = "Kunne ikke hente data. Har brugeren familier?";
      }
    };

    // Luk Modal
    document.getElementById('close-modal').addEventListener('click', () => {
      userModal.classList.add('hidden');
      document.getElementById('modal-loading').innerText = "Henter data...";
    });
    
    // Luk modal hvis man klikker uden for kassen
    window.onclick = function(event) {
      if (event.target == userModal) {
        userModal.classList.add('hidden');
        document.getElementById('modal-loading').innerText = "Henter data...";
      }
    }
  </script>
</body>
</html>
